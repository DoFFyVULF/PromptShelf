name: Release

# Push a tag like v0.1.5 → builds installers on GitHub's cloud and attaches
# them to a GitHub Release: .dmg (mac, universal) and setup.exe/.msi (Windows).
# The bundles are signed with the updater key so the in-app updater
# (tauri-plugin-updater, endpoint = the latest release's latest.json) works.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal mac build: one .dmg for Apple Silicon and Intel.
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PromptShelf ${{ github.ref_name }}"
          releaseBody: |
            **What's fixed in v0.2.1**

            **The logo switch, for real this time**

            - Switching between the prompt and lora shelves now rolls only the word — Prompt ↔ Lora — while "Shelf" glides along: no indent, no horizontal jump, no blank frame. It behaves the same in packaged builds as in dev.
            - The stray dot that lingered above the logo after a switch is gone.

            **Bring your own library**

            - Settings → Storage → the folder button now connects an existing library. Pick a folder that already contains `library.db` and `images/` and PromptShelf switches to it in place — nothing is copied over, nothing is overwritten.
            - The confirmation shows what was found (prompt and lora counts) before anything changes. Picking a folder without a library still copies the current one there.
            - If the folder's `library.db` is not a PromptShelf library, the app refuses instead of touching it.

            **Dark theme readability**

            - The card navigation arrows and the zoom badge on previews were white icons on white pills in the dark theme; they stay dark now.

            **Small things**

            - The update dialog has its own "Restarting the app…" label instead of borrowing the library-move copy.

            Installers, built from this tag with the updater signing key:

            **Windows** — `PromptShelf_*_x64-setup.exe` (recommended) or `.msi`.
            First launch may show a SmartScreen warning: click "More info" → "Run anyway".

            **macOS** — `PromptShelf_*.dmg` (universal: Apple Silicon + Intel).
            First launch: if Gatekeeper blocks an unsigned app, right-click the app
            in /Applications → "Open" once.
          # The release itself is pre-created as a draft by DoFFyVULF (so the
          # release author is a human, not github-actions); the action finds
          # the draft by tag and only uploads the built assets to it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

name: Release

# Push a tag like v0.1.5 → builds installers on GitHub's cloud and attaches
# them to a GitHub Release: .dmg (mac, universal) and setup.exe/.msi (Windows).
# The bundles are signed with the updater key so the in-app updater
# (tauri-plugin-updater, endpoint = the latest release's latest.json) works.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal mac build: one .dmg for Apple Silicon and Intel.
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PromptShelf ${{ github.ref_name }}"
          releaseBody: |
            **What's new in v0.2.2**

            **Paste a link, get a card**

            - Paste a CivitAI link anywhere in the app (Cmd/Ctrl+V) and it imports on its own: an image or post link becomes a prompt card, a model link becomes a LoraShelf import — same background jobs and duplicate handling as the import dialog. Pasting into an open dialog or an editor field still behaves normally.
            - Imported cards now link back to their CivitAI page, next to the author and checkpoint. Cards you made by hand stay link-free.
            - Lora chips in the card detail open a menu: copy the `<lora:name:weight>` tag, send it to LoraShelf, or open the model's CivitAI page. Links now resolve for lycoris/locon and on-site generations too.
            - Upscalers, embeddings and workflows come along for the ride: a new "Other resources" section lists them as chips with a type badge and a page link.
            - Fixed: embeddings and workflows were silently dropped from imports. The importer now reads the image page's full resource list, so nothing is lost — the old per-version lookup stays as a fallback for gated or deleted data.

            **A delete you can't miss**

            - The trash button in the card and lora footers springs open into a red "Are you sure?" pill while the edit action folds down to its icon, so the destructive second click is explicit instead of a hidden double-tap.
            - Fixed: in the dark theme the armed pill kept its dark text on the bright red fill. It now uses the same ink color as the Edit button.

            **One drag ghost for both shelves**

            - Dragging a Lora used to fall back to the browser's default ghost, so the two shelves felt like different apps in flight. Both now paint the same lifted ghost — prompt text plus the selection count, or the Lora name with its tag and base-model pills. It renders a touch larger with a deeper, softer shadow while the source tile shrinks back, so it reads as picked up.

            **Small things**

            - Fixed: the tail of the "p" in Prompt leaked into the Lora wordmark as a stray dot above the r and a on Windows. Each letter cell is now clipped on its parent, so the descender stays put without trimming the stretch.

            Installers, built from this tag with the updater signing key:

            **Windows** — `PromptShelf_*_x64-setup.exe` (recommended) or `.msi`.
            First launch may show a SmartScreen warning: click "More info" → "Run anyway".

            **macOS** — `PromptShelf_*.dmg` (universal: Apple Silicon + Intel).
            First launch: if Gatekeeper blocks an unsigned app, right-click the app
            in /Applications → "Open" once.
          # The release itself is pre-created as a draft by DoFFyVULF (so the
          # release author is a human, not github-actions); the action finds
          # the draft by tag and only uploads the built assets to it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

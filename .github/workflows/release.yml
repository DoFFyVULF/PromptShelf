name: Release

# Push a tag like v0.1.5 → builds installers on GitHub's cloud and attaches
# them to a GitHub Release: .dmg (mac, universal) and setup.exe/.msi (Windows).
# The bundles are signed with the updater key so the in-app updater
# (tauri-plugin-updater, endpoint = the latest release's latest.json) works.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal mac build: one .dmg for Apple Silicon and Intel.
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PromptShelf ${{ github.ref_name }}"
          releaseBody: |
            **What's new in v0.2.7**

            **The shelf keeps only what you can see**

            - Both shelves now render just the rows on screen plus two overscan rows, so even a very large library holds roughly 30–50 tiles in the DOM instead of every card. Cards keep their real, variable height — tags wrap, prompts run long — because each row is measured and cached, and rows that have not been measured yet use an estimate based on the actual column width.
            - Rows are positioned at cached offsets, and when a row above the viewport changes height the scroll offset is nudged by the same amount. The shelf never jumps while it measures, while you filter, or while a card pins. LoRA family decks are collapsed into one entry before rows are counted, and import jobs stay above the list so their exits still animate.
            - Covers decode asynchronously and fade in once ready instead of popping in mid-scroll. The entrance stagger plays only on the first beat; rows that scroll into view later fade quietly, and reduced-motion preferences are respected. The result is that WebView2 no longer decodes and holds bitmaps for the whole library at once.

            **The shelf holds still**

            - Tiles no longer jitter sideways in narrow windows. The shelf sat right on a column boundary, and a scrollbar appearing or disappearing shifted the content width by about 15px — flipping the grid between two and three columns and sliding every card. The scrollbar track is now reserved, the column switch has a small dead zone, and pin feedback lives in the bloom and lift rather than a spring flight, so a re-measured row cannot add motion on top of the width.

            **A pinned card opens gilded**

            - Card and LoRA detail now inherit the pin state of the tile they were opened from. A pinned item opens as a two-tone gilded panel: the photo half carries the exact warm tint of its tile, the info half a quieter ivory, and a single metal hairline runs across the top like the tile's gilded rim.
            - The pin seal sits in the corner of the photo half, beside a gold "Pinned" label. One click there toggles the pin in place and recolors the whole panel, so the modal always reads as the opened version of the card on the main screen — no trip back to the shelf.

            **Small things**

            - Creating a LoRA now drops it into the group you are looking at, instead of wherever the shelf happened to be sorted.
            - PromptShelf is now MIT-licensed.

            ---

            **Windows** — `PromptShelf_*_x64-setup.exe` (recommended) or `.msi`.
            First launch may show a SmartScreen warning: click "More info" → "Run anyway".

            **macOS** — `PromptShelf_*.dmg` (universal: Apple Silicon + Intel).
            First launch: if Gatekeeper blocks an unsigned app, right-click the app
            in /Applications → "Open" once.
          # The release itself is pre-created as a draft by DoFFyVULF (so the
          # release author is a human, not github-actions); the action finds
          # the draft by tag and only uploads the built assets to it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

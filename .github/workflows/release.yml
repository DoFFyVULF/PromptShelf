name: Release

# Push a tag like v0.1.5 → builds installers on GitHub's cloud and attaches
# them to a GitHub Release: .dmg (mac, universal) and setup.exe/.msi (Windows).
# The bundles are signed with the updater key so the in-app updater
# (tauri-plugin-updater, endpoint = the latest release's latest.json) works.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal mac build: one .dmg for Apple Silicon and Intel.
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PromptShelf ${{ github.ref_name }}"
          releaseBody: |
            **What's new in v0.2.6**

            **Order by what's inside**

            - The sort control is now a small panel of our own instead of the system dropdown: a quiet pill in the header that opens exactly over itself and unfolds from the right edge like a Dock tile. Arrow keys, Home/End, Enter/Space and Esc all work, the selected order keeps its check in the leading chip, and no row clips.
            - Two orders now read a shelf's depth: PromptShelf can bring cards with the most variants first, LoraShelf the loras with the most versions — counted across the same version family the deck is built from, with a lone lora counting as one. Each shelf keeps its own order as you move between prompts and loras; pinned cards still float above.

            **Prompt cards keep their ComfyUI recipe**

            - Import now reads the ComfyUI workflow behind a CivitAI image: node, link and group counts, the busiest node classes, the image id and title. A card that carries a workflow wears a compact seal in its meta row — a dashed, hollow constellation while the JSON lives only on CivitAI, a filled graph with a check once it is archived.
            - The constellation densifies with the node count across four tiers, so a 40-node graph reads heavier than a 5-node one at a glance. The stamp ring plays only on a real false → true flip, so opening a shelf stays quiet.
            - Card detail gathers the workflow in a parchment tile: engine, counts, top node chips and a JSON button. It re-fetches the full graph from CivitAI, dedupes by content, writes `Workflows/<slug>.json` into the library, and turns into "Open folder". Saved files are re-checked on read, so a moved library tells the truth.

            **A deck pins as one**

            - A LoRA deck now carries the same quiet pin as a single tile: one click pins every version in the group, they float to the top together and wear the gold seal; one more click sends them home. Splitting the group has moved into the deck view, beside the variants it affects.

            **The shelf stays where you left it**

            - Pinning no longer drags the view to the top. The scroll anchor is off, focus returns without scrolling, and a reorder keeps the offset it started with — on both Chromium and WebKit.
            - Unpinning now always sends a card home: the backend's floated-row index is ignored and the home order is rebuilt from the active sort.
            - Reloading the shelf mid-write no longer re-pins a card behind your back; pending pin writes are replayed over the fetched list, so a late response cannot undo your choice.

            **Small things**

            - Copy in card detail now follows the page you are reading: both the Copy button and the copy shortcut take the open variant instead of the main prompt, and opening another card starts on its main prompt again.

            ---

            **Windows** — `PromptShelf_*_x64-setup.exe` (recommended) or `.msi`.
            First launch may show a SmartScreen warning: click "More info" → "Run anyway".

            **macOS** — `PromptShelf_*.dmg` (universal: Apple Silicon + Intel).
            First launch: if Gatekeeper blocks an unsigned app, right-click the app
            in /Applications → "Open" once.
          # The release itself is pre-created as a draft by DoFFyVULF (so the
          # release author is a human, not github-actions); the action finds
          # the draft by tag and only uploads the built assets to it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

name: Release

# Push a tag like v0.1.5 → builds installers on GitHub's cloud and attaches
# them to a GitHub Release: .dmg (mac, universal) and setup.exe/.msi (Windows).
# The bundles are signed with the updater key so the in-app updater
# (tauri-plugin-updater, endpoint = the latest release's latest.json) works.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal mac build: one .dmg for Apple Silicon and Intel.
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PromptShelf ${{ github.ref_name }}"
          releaseBody: |
            **What's new in v0.2.0**

            **Lora shelf** — a second, dedicated library next to your prompts:

            - One click on the logo flips between the prompt and lora shelves, each with its own groups, tags and detail panel.
            - Import Lora models straight from CivitAI model pages: preview images, base model, trigger words, usage tips and descriptions land as a rich card with highlighted links.
            - Inline editing — rename, tag and annotate loras right in the detail panel.

            **Self-updating**

            - PromptShelf now checks GitHub releases in the background at launch. Don't want it? There's a toggle in Settings → Updates.
            - When a new version is found, the logo plays a slot-drum tease and turns into "Update Shelf" — click it to review and install. Cancelling keeps things quiet until the next launch, and the Updates section in Settings always shows the pending version.
            - Release notes are now typeset: headings, bullets, filenames and links render the way they were written.

            **Editing & polish**

            - Tag suggestions in every editor; paste images from the clipboard straight into card / lora detail while editing.
            - Animated boot loader, a typewriter empty state for the prompt shelf and a before/after comparison card for the lora shelf.
            - Smoother mode-switch transitions in the header, softer focus rings, and a ⌘C hint on the lora copy button.

            Installers, built from this tag with the updater signing key:

            **Windows** — `PromptShelf_*_x64-setup.exe` (recommended) or `.msi`.
            First launch may show a SmartScreen warning: click "More info" → "Run anyway".

            **macOS** — `PromptShelf_*.dmg` (universal: Apple Silicon + Intel).
            First launch: if Gatekeeper blocks an unsigned app, right-click the app
            in /Applications → "Open" once.
          # The release itself is pre-created as a draft by DoFFyVULF (so the
          # release author is a human, not github-actions); the action finds
          # the draft by tag and only uploads the built assets to it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

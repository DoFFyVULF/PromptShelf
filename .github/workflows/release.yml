name: Release

# Push a tag like v0.1.5 → builds installers on GitHub's cloud and attaches
# them to a GitHub Release: .dmg (mac, universal) and setup.exe/.msi (Windows).
# The bundles are signed with the updater key so the in-app updater
# (tauri-plugin-updater, endpoint = the latest release's latest.json) works.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal mac build: one .dmg for Apple Silicon and Intel.
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PromptShelf ${{ github.ref_name }}"
          releaseBody: |
            **What's new in v0.2.3**

            **Variants you can see**

            - Cards holding more than one prompt now wear a subtle stack of text sheets, with an always-visible count under the excerpt — separate from the image counter, so alternates read at a glance. Hover or keyboard-focus a card and the sheets gently spread; opening, selecting and dragging work exactly as before, and reduced motion is respected. List summaries show variant counts too, without extra requests.

            **A calmer tag browser — with a choice of matching**

            - The cramped tag grid is now a roomier, theme-aware dialog: search, a dedicated selection area, readable usage counts and helpful empty states, with native focus handling and keyboard shortcuts. Long tag names stay readable.
            - Matching is now an explicit, animated switch: show cards with *any* selected tag or with *all* of them, on both the prompt and LoRA shelves. The rule survives reopening the dialog and stays independent from the shelf's text search.
            - The transitions got care as well: chips fade and scale without fighting the reflow, the empty-selection hint crossfades, and the any/all labels roll past each other in a clipped track — rapid toggles reverse the motion instead of overlapping text.

            **Delete the whole selection, still can't miss it**

            - The floating selection bar now has a trash action for everything you've picked. It springs open into the same red "Are you sure?" pill as the single-item delete, re-skinned for the dark bar. Changing the selection or switching shelves disarms it, so a stale confirm can never fire on a different set.

            **Small things**

            - Fixed: copy, paste and the other shortcuts (Cmd/Ctrl+C, V, N, F, ,) never fired on non-Latin keyboard layouts — on Russian, Ctrl+C arrives as the letter "с". Shortcuts now resolve through the physical key when the layout produces non-Latin characters, so they work on any layout while Dvorak-style remaps keep working.
            - Fixed: a LoRA imported without trigger words showed a prominent copy button that did nothing. It now sits quiet in the row without the ⌘C hint, the trigger-words section shows a dashed note pointing at Edit, and clicking the inert button explains itself instead of failing silently.

            Installers, built from this tag with the updater signing key:

            **Windows** — `PromptShelf_*_x64-setup.exe` (recommended) or `.msi`.
            First launch may show a SmartScreen warning: click "More info" → "Run anyway".

            **macOS** — `PromptShelf_*.dmg` (universal: Apple Silicon + Intel).
            First launch: if Gatekeeper blocks an unsigned app, right-click the app
            in /Applications → "Open" once.
          # The release itself is pre-created as a draft by DoFFyVULF (so the
          # release author is a human, not github-actions); the action finds
          # the draft by tag and only uploads the built assets to it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

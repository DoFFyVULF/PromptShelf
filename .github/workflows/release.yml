name: Release

# Push a tag like v0.1.5 → builds installers on GitHub's cloud and attaches
# them to a GitHub Release: .dmg (mac, universal) and setup.exe/.msi (Windows).
# The bundles are signed with the updater key so the in-app updater
# (tauri-plugin-updater, endpoint = the latest release's latest.json) works.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal mac build: one .dmg for Apple Silicon and Intel.
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PromptShelf ${{ github.ref_name }}"
          releaseBody: |
            **What's new in v0.2.4**

            **A place for photos without prompts**

            - CivitAI pages published without generation data no longer end in a generic fetch error. The import parks as a quiet "No prompt" tile with a softened preview of the site photo, then asks one clear question: keep the image or let it go. Nothing is downloaded until you say yes — and the download is restricted to CivitAI HTTPS links.
            - Kept photos become ordinary cards with an empty prompt and a gentle note in the detail view. Rating, tags, notes and variants stay fully editable, so the prompt can be written whenever you like. The floating import receipt and the card pager both understand these cards now.

            **Every version gets its own shelf slot**

            - Pinned `?modelVersionId=` links now survive clipboard auto-import, so the exact version you were looking at reaches the library instead of the model's default one.
            - LoRA origins are version-scoped (`civitai:model:<model>:<version>`), so the same model built for Moss, Krea 2 and friends lives side by side instead of tripping the duplicate warning. Unpinned links are checked after the fetch, once the version is known, and the CivitAI link on the detail page points at that version too. The duplicate dialog now speaks LoRA rather than prompt.

            **One tile for the whole family**

            - When the same lora turns up in several versions or for several base models, LoraShelf offers to fold them into a single deck — right between search and sort. Accept or decline; the choice sticks.
            - A group takes exactly one normal-sized tile: mini covers tilted on the Z axis, fanning out on hover. Open it to see every variant, jump into any one of them, or split the group apart — the offer returns when you want to gather them again.
            - Declined a group and changed your mind later? Each matching lora page carries its own quiet grouping button, so the decision is never buried.

            **Small things**

            - Fixed: the sort dropdown drew a hard 2px keyboard outline on click. It now fades into the same active border and soft shadow ring as the search field, with the same easing.

            Installers, built from this tag with the updater signing key:

            **Windows** — `PromptShelf_*_x64-setup.exe` (recommended) or `.msi`.
            First launch may show a SmartScreen warning: click "More info" → "Run anyway".

            **macOS** — `PromptShelf_*.dmg` (universal: Apple Silicon + Intel).
            First launch: if Gatekeeper blocks an unsigned app, right-click the app
            in /Applications → "Open" once.
          # The release itself is pre-created as a draft by DoFFyVULF (so the
          # release author is a human, not github-actions); the action finds
          # the draft by tag and only uploads the built assets to it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

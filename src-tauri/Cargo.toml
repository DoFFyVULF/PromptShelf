[package]
name = "promptshelf"
version = "0.2.7"
description = "Local prompt library with image results"
edition = "2021"
rust-version = "1.85"

[lib]
name = "promptshelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
webp = "0.3"
arboard = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
kamadak-exif = "0.6"
base64 = "0.22"
ureq = { version = "2", features = ["gzip"] }
# Prompt translation. Google Translate without an API key; the async flavour
# keeps the request off the UI thread (Tauri commands run on its tokio runtime).
translators = { version = "0.2.1", default-features = false, features = ["google", "tokio-async"] }
sha2 = "0.10"
unicode-normalization = "0.1"
ammonia = "4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
